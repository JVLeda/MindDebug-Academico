# MySQL local para desenvolvimento do MindDebug.
# Os valores abaixo sao os mesmos de src/util/Conexao.java.
# Iniciar: docker compose up -d
# Parar:   docker compose stop

name: minddebug

services:
  mysql:
    image: mysql:8.4
    container_name: minddebug-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: minddebug
      MYSQL_USER: minddebug
      MYSQL_PASSWORD: minddebug
      MYSQL_ROOT_PASSWORD: minddebug-root
      TZ: America/Fortaleza
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - minddebug-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uminddebug -pminddebug --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  minddebug-dados:
